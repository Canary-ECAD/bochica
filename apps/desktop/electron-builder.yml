appId: com.canary-ecad.bochica
productName: Bochica
copyright: Copyright © 2026 Canary-ECAD
# The install folder (%LOCALAPPDATA%\Programs\bochica) and the updater's cache take the package
# name; without this they would be "@bochicadesktop". User data follows productName (Bochica).
extraMetadata:
  name: bochica
directories:
  output: release
  buildResources: build
files:
  - out/**
# Python, eplan-mcp and the built-in skills, put together by scripts/prepare-runtime.ts.
extraResources:
  - from: runtime
    to: runtime
  # The window that stays up while the installer replaces the app (src/main/update-helper.ts).
  - from: resources/update-helper
    to: update-helper
  - from: build/icon.ico
    to: update-helper/icon.ico
  - from: build/icon.png
    to: update-helper/icon.png
win:
  target: nsis
# The one-click installer's window takes productName and the app's icon, and its language follows
# Windows': electron-builder bundles every NSIS language unless installerLanguages narrows them.
# It only shows when the update helper couldn't start (otherwise the install is silent).
nsis:
  oneClick: true
  perMachine: false
# `bun run release` uploads to a draft release (docs/releasing.md); the packaged app reads this
# feed back from resources\app-update.yml to find updates.
publish:
  provider: github
  owner: Canary-ECAD
  repo: bochica
  releaseType: draft
