name: release

# A tag vX.Y.Z builds the installer and uploads it, with its blockmap and latest.yml, to a draft
# GitHub release. Installed apps only see the release once a maintainer publishes it. The steps
# are in docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: The tag matches the app's version
        shell: bash
        run: |
          version=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json ($version)."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Python, uv and the component archives, all pinned by hash or commit.
      - uses: actions/cache@v4
        with:
          path: apps/desktop/.cache
          key: runtime-${{ hashFiles('packages/eplan/src/runtime.ts', 'components.lock.json', 'packages/eplan/requirements.lock.txt') }}
      - run: bun run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
